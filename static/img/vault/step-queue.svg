<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="How the progress step queue works: a block's steps are queued, the first one is active, and routing queues the next block">
  <defs>
    <style>
      .paper { fill: #faf9f6; stroke: rgba(43,43,43,0.18); }
      .rule  { stroke: #2b2b2b; fill: none; stroke-width: 1.4; }
      .thin  { stroke: rgba(43,43,43,0.45); fill: none; stroke-width: 1.1; }
      .dash  { stroke: rgba(43,43,43,0.4); fill: none; stroke-width: 1.1; stroke-dasharray: 5 4; }
      .box   { fill: rgba(43,43,43,0.05); stroke: #2b2b2b; stroke-width: 1.3; }
      .boxq  { fill: none; stroke: rgba(43,43,43,0.4); stroke-width: 1.1; }
      .active{ fill: rgba(43,43,43,0.14); stroke: #2b2b2b; stroke-width: 1.8; }
      .t     { font-family: ui-sans-serif, "Segoe UI", Helvetica, Arial, sans-serif; fill: #2b2b2b; }
      .h     { font-size: 19px; font-weight: 600; }
      .b     { font-size: 14px; font-weight: 600; }
      .s     { font-size: 13px; fill: #6d685f; }
      .n     { font-size: 12px; fill: #6d685f; font-style: italic; }
    </style>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b2b2b"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="399" rx="10" class="paper"/>

  <text x="40" y="46" class="t h">The step queue</text>
  <text x="40" y="70" class="t s">Starting a block puts all of its steps in the queue. The first one in the queue is the active step.</text>

  <!-- block -->
  <g transform="translate(40,104)">
    <rect x="0" y="0" width="230" height="150" rx="8" class="dash"/>
    <text x="16" y="26" class="t b">Block "Prepare"</text>
    <rect x="16" y="42" width="198" height="30" rx="5" class="box"/>
    <text x="28" y="62" class="t s">Step 1</text>
    <rect x="16" y="80" width="198" height="30" rx="5" class="box"/>
    <text x="28" y="100" class="t s">Step 2</text>
    <rect x="16" y="118" width="198" height="22" rx="5" class="box"/>
    <text x="28" y="134" class="t s">Step 3</text>
  </g>

  <path d="M 280 178 L 316 178" class="rule" marker-end="url(#a3)"/>
  <text x="272" y="166" class="t s">queued</text>

  <!-- queue -->
  <g transform="translate(325,104)">
    <text x="0" y="-8" class="t b">Step queue</text>
    <text x="104" y="-8" class="t n">first in, first out</text>

    <rect x="0" y="8" width="150" height="44" rx="6" class="active"/>
    <text x="16" y="36" class="t b">Step 1</text>
    <text x="104" y="36" class="t n">active</text>

    <rect x="0" y="62" width="150" height="40" rx="6" class="boxq"/>
    <text x="16" y="88" class="t s">Step 2</text>

    <rect x="0" y="110" width="150" height="40" rx="6" class="boxq"/>
    <text x="16" y="136" class="t s">Step 3</text>

    <path d="M 75 158 L 75 186" class="thin" marker-end="url(#a3)"/>
    <text x="-4" y="204" class="t s">completed steps leave the front</text>
  </g>

  <!-- routing -->
  <g transform="translate(560,104)">
    <text x="0" y="-8" class="t b">Routing, on the step that leads onwards</text>

    <rect x="0" y="8" width="290" height="76" rx="8" class="box"/>
    <text x="16" y="34" class="t b">Constant Enqueue</text>
    <text x="16" y="56" class="t s">queue that block: at the End,</text>
    <text x="16" y="74" class="t s">or at the Start to jump ahead</text>

    <rect x="0" y="98" width="290" height="96" rx="8" class="box"/>
    <text x="16" y="124" class="t b">Conditional Enqueue</text>
    <text x="16" y="146" class="t s">flags the scene ticks off, combined</text>
    <text x="16" y="164" class="t s">as All or At Least n - true queues</text>
    <text x="16" y="182" class="t s">one block, false the other</text>

    <text x="0" y="222" class="t n">Delete Step Queue clears what was pending first.</text>
  </g>
</svg>
