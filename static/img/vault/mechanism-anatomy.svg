<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Anatomy of a grip constraint: pivot, axis, start and end, shown on a door and a drawer">
  <defs>
    <style>
      .paper { fill: #faf9f6; stroke: rgba(43,43,43,0.18); }
      .rule  { stroke: #2b2b2b; fill: none; stroke-width: 1.4; }
      .thin  { stroke: rgba(43,43,43,0.45); fill: none; stroke-width: 1.1; }
      .dash  { stroke: rgba(43,43,43,0.45); fill: none; stroke-width: 1.1; stroke-dasharray: 5 4; }
      .body  { fill: rgba(43,43,43,0.06); stroke: #2b2b2b; stroke-width: 1.4; }
      .ghost { fill: none; stroke: rgba(43,43,43,0.3); stroke-width: 1.1; stroke-dasharray: 4 4; }
      .t     { font-family: ui-sans-serif, "Segoe UI", Helvetica, Arial, sans-serif; fill: #2b2b2b; }
      .h     { font-size: 19px; font-weight: 600; }
      .b     { font-size: 15px; font-weight: 600; }
      .s     { font-size: 13px; fill: #6d685f; }
      .n     { font-size: 12px; fill: #6d685f; font-style: italic; }
    </style>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b2b2b"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="419" rx="10" class="paper"/>

  <text x="40" y="46" class="t h">What a Grip Constraint says</text>
  <text x="40" y="70" class="t s">One axis, two ends. The object moves and the hand goes with it.</text>

  <!-- TURN -->
  <g transform="translate(60,110)">
    <text x="0" y="0" class="t b">Turn</text>
    <text x="52" y="0" class="t s">a door, a dial, a valve</text>

    <!-- hinge -->
    <circle cx="30" cy="130" r="5" fill="#2b2b2b"/>
    <text x="6" y="168" class="t s">Pivot</text>
    <path d="M 30 60 L 30 200" class="dash"/>
    <text x="40" y="56" class="t s">Axis</text>

    <!-- closed door -->
    <rect x="30" y="100" width="150" height="60" class="body"/>
    <text x="86" y="136" class="t s">start</text>

    <!-- open door -->
    <g transform="rotate(-55 30 130)">
      <rect x="30" y="100" width="150" height="60" class="ghost"/>
    </g>
    <text x="128" y="46" class="t s">end</text>

    <path d="M 190 128 A 100 100 0 0 0 128 44" class="thin" marker-end="url(#a2)"/>
    <text x="6" y="230" class="t s">At: degrees</text>
    <text x="6" y="250" class="t n">Within: how near counts as reached</text>
  </g>

  <!-- SLIDE -->
  <g transform="translate(470,110)">
    <text x="0" y="0" class="t b">Slide</text>
    <text x="52" y="0" class="t s">a drawer, a bolt, a button</text>

    <path d="M 10 130 L 330 130" class="dash"/>
    <text x="10" y="118" class="t s">Axis</text>

    <rect x="20" y="100" width="110" height="60" class="body"/>
    <text x="46" y="182" class="t s">start</text>
    <rect x="215" y="100" width="110" height="60" class="ghost"/>
    <text x="244" y="182" class="t s">end</text>

    <path d="M 140 130 L 205 130" class="thin" marker-end="url(#a2)"/>
    <text x="10" y="230" class="t s">At: metres</text>
    <text x="10" y="250" class="t n">each end fires On Reached / On Left</text>
  </g>

  <!-- footer -->
  <g transform="translate(60,372)">
    <text x="0" y="0" class="t s">Moves <tspan class="t b">The Object</tspan> - the whole grabbable travels.   Moves <tspan class="t b">This Part</tspan> - only this grip point and what hangs off it.</text>
  </g>
</svg>
